---
- name: Start Traefik
  block:
    - name: Create Traefik Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ traefik_data_directory }}"
        - "{{ traefik_data_directory }}/letsencrypt"
        - "{{ traefik_data_directory }}/dynamic"

    - name: Template Traefik config.toml
      ansible.builtin.template:
        src: traefik.toml
        dest: "{{ traefik_data_directory }}/traefik.toml"
      register: template_config

    - name: Template Traefik external hosts config
      ansible.builtin.template:
        src: dynamic.toml
        dest: "{{ traefik_data_directory }}/dynamic/external-hosts.toml"
      when: traefik_external_hosts | length > 0
      register: template_dynamic_config

    - name: Traefik Docker Container
      community.docker.docker_container:
        name: "{{ traefik_container_name }}"
        image: "{{ traefik_image_name }}:{{ traefik_image_version }}"
        pull: true
        network_mode: host
        volumes:
          - "{{ traefik_data_directory }}/traefik.toml:/etc/traefik/traefik.toml:ro"
          - "{{ traefik_data_directory }}/dynamic:/etc/traefik/dynamic:ro"
          - "{{ traefik_data_directory }}/letsencrypt:/letsencrypt:rw"
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
        env: "{{ traefik_environment_variables }}"
        restart_policy: unless-stopped
        memory: "{{ traefik_memory }}"
        memory_swap: "{{ traefik_memory }}"
        pids_limit: 200
        cpu_shares: 2048
        recreate: "{{ template_config is changed or (template_dynamic_config is defined and template_dynamic_config is changed) }}"
        healthcheck:
          # Traefik image is FROM scratch — no shell, so CMD form (not CMD-SHELL).
          # `traefik healthcheck --ping` reads the static config for the ping URL;
          # requires `[ping] entryPoint = "traefik"` in traefik.toml.
          test: ["CMD", "traefik", "healthcheck", "--ping"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 30s
        labels:
          homepage.group: Networking
          homepage.name: Traefik
          homepage.icon: traefik
          homepage.href: "http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ traefik_port_ui }}"
          homepage.description: Reverse Proxy
          homepage.widget.type: traefik
          homepage.widget.url: "http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ traefik_port_ui }}"
  when: traefik_enabled is true

- name: Stop Traefik
  block:
    - name: Stop Traefik
      community.docker.docker_container:
        name: "{{ traefik_container_name }}"
        state: absent
  when: traefik_enabled is false
