---
- name: Start Tailscale
  block:
    - name: Create Tailscale Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ tailscale_data_directory }}"
        - "{{ tailscale_data_directory }}/state"

    - name: Enable IP forwarding for subnet routing
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding
      when: tailscale_advertise_routes | length > 0 or tailscale_exit_node

    - name: Build Tailscale extra arguments
      ansible.builtin.set_fact:
        # --reset makes inventory the single source of truth: any flag previously
        # set but no longer listed here is cleared on next `tailscale up`.
        # Without it, removing a flag (e.g. --advertise-routes) leaves the
        # container in a boot loop because tailscaled refuses to silently drop
        # persisted settings.
        tailscale_extra_args: >-
          --reset
          --hostname={{ tailscale_hostname }}
          {% if tailscale_advertise_routes %}--advertise-routes={{ tailscale_advertise_routes }}{% endif %}
          {% if tailscale_exit_node %}--advertise-exit-node{% endif %}
          {% if tailscale_accept_routes %}--accept-routes{% endif %}
          {% if tailscale_accept_dns %}--accept-dns{% else %}--accept-dns=false{% endif %}

    - name: Create Tailscale Docker Container
      community.docker.docker_container:
        name: "{{ tailscale_container_name }}"
        image: "{{ tailscale_image_name }}:{{ tailscale_image_version }}"
        pull: true
        volumes:
          - "{{ tailscale_data_directory }}/state:/var/lib/tailscale"
          - "/dev/net/tun:/dev/net/tun"
        env:
          TS_AUTHKEY: "{{ tailscale_auth_key }}"
          TS_STATE_DIR: "/var/lib/tailscale"
          TS_EXTRA_ARGS: "{{ tailscale_extra_args | trim }}"
          TS_USERSPACE: "false"
        capabilities:
          - NET_ADMIN
          - NET_RAW
          - SYS_MODULE
        network_mode: host
        restart_policy: unless-stopped
        memory: "{{ tailscale_memory }}"
        memory_swap: "{{ tailscale_memory }}"
        pids_limit: 200
        cpu_shares: 1024
        healthcheck:
          # Native probe — confirms the backend is up and authenticated.
          test: ["CMD-SHELL", "tailscale status --self=true >/dev/null 2>&1 || exit 1"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 60s
        labels:
          homepage.group: Networking
          homepage.name: Tailscale
          homepage.icon: tailscale
          homepage.href: "https://login.tailscale.com/admin/machines"
          homepage.description: VPN Access
  when: tailscale_enabled is true

- name: Stop Tailscale
  block:
    - name: Stop Tailscale
      community.docker.docker_container:
        name: "{{ tailscale_container_name }}"
        state: absent
  when: tailscale_enabled is false
