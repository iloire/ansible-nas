---
# Sends server health metrics (disk, memory, CPU, services) to Devil Watchdog.
# The script is bundled in files/ to keep this role self-contained.
# On other servers, the same script lives in ~/dotfiles/bin/ and is deployed
# via the ansible-recipes project (roles/crontab), also running hourly.
# Cron runs as the ansible user; env vars are inlined because there's no
# local-overrides file on the NAS to source them from.

- name: Install send-watchdog-report script
  ansible.builtin.copy:
    src: send-watchdog-report
    dest: /usr/local/bin/send-watchdog-report
    mode: "0755"
  become: true
  when: watchdog_report_enabled

- name: Set up watchdog report cron job
  ansible.builtin.cron:
    name: "watchdog server health report"
    minute: "*/15"
    job: "WATCHDOG_API_KEY={{ watchdog_api_key }} WATCHDOG_SERVICES={{ watchdog_services }} /usr/local/bin/send-watchdog-report"
  when: watchdog_report_enabled

- name: Remove watchdog report cron job
  ansible.builtin.cron:
    name: "watchdog server health report"
    state: absent
  when: not watchdog_report_enabled
